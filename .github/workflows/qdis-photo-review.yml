name: QDIS photo review finalize (temporary)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name != 'pull_request' || github.head_ref == 'preview/qdis-initial-site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/qdis-initial-site
      - name: Keep selected official photos and remove review files
        run: |
          set -euo pipefail
          mkdir -p public/images/qdis/gallery
          cp public/images/qdis/review-opt/291-1.jpg public/images/qdis/gallery/pi-day-2026.jpg
          cp public/images/qdis/review-opt/297-1.jpg public/images/qdis/gallery/sports-day-2026-group.jpg
          cp public/images/qdis/review-opt/297-2.jpg public/images/qdis/gallery/sports-day-2026-basketball.jpg
          cp public/images/qdis/review-opt/295-1.jpg public/images/qdis/gallery/wsc-award-2026.jpg
          cp public/images/qdis/review-opt/298-1.jpg public/images/qdis/gallery/english-play-2026.jpg
          rm -rf public/images/qdis/review public/images/qdis/review-opt
          rm -f .github/workflows/qdis-photo-review.yml
      - name: Commit selected photo assets
        run: |
          git config user.name "qdis-photo-qa[bot]"
          git config user.email "qdis-photo-qa@users.noreply.github.com"
          git add -A
          git commit -m "Add selected high-resolution QDIS gallery photos"
          git pull --rebase origin preview/qdis-initial-site
          git push origin HEAD:preview/qdis-initial-site
