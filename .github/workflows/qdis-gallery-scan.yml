name: QDIS gallery scan (temporary)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: github.event_name != 'pull_request' || github.head_ref == 'preview/qdis-initial-site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan recent official gallery posts and image URLs
        run: |
          node --input-type=module <<'NODE'
          import {fetchText, parseBoardList, QDIS} from './lib/monitoring/qdis-parse.mjs';
          const html = await fetchText(`${QDIS}/board/index.html?id=news`, {timeoutMs: 30000});
          const posts = parseBoardList(html, 'news').slice(0, 40);
          console.log('GALLERY_POSTS_START');
          console.log(JSON.stringify(posts, null, 2));
          console.log('GALLERY_POSTS_END');
          for (const p of posts.slice(0, 15)) {
            const detail = await fetchText(p.url, {timeoutMs: 30000});
            const imgs = [...detail.matchAll(/(?:src|href)=["']([^"']+\.(?:jpe?g|png|webp))/gi)]
              .map(m => new URL(m[1].replace(/&amp;/g,'&'), QDIS).href)
              .filter((v,i,a)=>a.indexOf(v)===i)
              .filter(u => !/logo|icon|button|banner|menu|consult|letter/i.test(u));
            console.log(`DETAIL_${p.no}_START`);
            console.log(JSON.stringify({post:p,images:imgs}, null, 2));
            console.log(`DETAIL_${p.no}_END`);
          }
          NODE
