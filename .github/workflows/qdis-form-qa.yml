name: QDIS consultation form QA (temporary)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-preview-test:
    if: github.event_name != 'pull_request' || github.head_ref == 'preview/qdis-initial-site'
    runs-on: ubuntu-latest
    steps:
      - name: Submit clearly marked test lead to Deploy Preview
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/qdis-form-response.html -w "%{http_code}"             -X POST "https://deploy-preview-1--qdis-korea.netlify.app/"             -H "Content-Type: application/x-www-form-urlencoded"             --data-urlencode "form-name=qdis-consultation"             --data-urlencode "name=TNS QA TEST"             --data-urlencode "phone=010-0000-0000"             --data-urlencode "email=qa-test@example.com"             --data-urlencode "grade=미정"             --data-urlencode "when=정보 수집 중"             --data-urlencode "program=미정"             --data-urlencode "current=기타"             --data-urlencode "message=Automated Preview QA test submission. Safe to delete."             --data-urlencode "privacy=동의")
          echo "HTTP $code"
          test "$code" -ge 200 -a "$code" -lt 400
