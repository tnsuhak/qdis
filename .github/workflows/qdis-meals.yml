name: QDIS meal sync (manual maintenance)

# 예약 실행은 qdis-monitor.yml의 주간 통합 감시가 담당합니다.
# 이 workflow는 필요할 때 preview/feature branch에서 수동 점검할 때만 사용합니다.
# main 직접 커밋은 차단합니다.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qdis-meals-manual
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse direct main update
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Manual meal sync must run on a preview/feature branch, not main."
            exit 1
          fi

      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and validate official QDIS meals
        run: node scripts/sync/meals.mjs

      - name: Commit only when the official meal data changed
        shell: bash
        run: |
          if git diff --quiet -- data/meals/latest.json; then
            echo "Official meal data is unchanged. No commit, no deploy."
            exit 0
          fi

          OTHER="$(git status --porcelain | grep -v 'data/meals/latest.json' || true)"
          if [ -n "$OTHER" ]; then
            echo "Unexpected changed files detected:"
            echo "$OTHER"
            exit 1
          fi

          git config user.name "qdis-meals[bot]"
          git config user.email "qdis-meals@users.noreply.github.com"
          git add data/meals/latest.json
          git commit -m "chore(meals): refresh QDIS weekly menu"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
