name: QDIS image optimization (temporary)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.event_name != 'pull_request' || github.head_ref == 'preview/qdis-initial-site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/qdis-initial-site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Optimize local QDIS images and refresh facility dimensions
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false sharp
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import sharp from 'sharp';

          const dirs = [
            'public/images/qdis/facilities',
            'public/images/qdis/gallery',
          ];

          for (const dir of dirs) {
            for (const name of fs.readdirSync(dir).filter(n => /\.(jpe?g)$/i.test(n))) {
              const file = path.join(dir, name);
              const input = fs.readFileSync(file);
              const meta = await sharp(input).metadata();
              const tooLarge = (meta.width ?? 0) > 1800 || (meta.height ?? 0) > 1800;
              const out = await sharp(input)
                .rotate()
                .resize(tooLarge ? {width: 1800, height: 1800, fit: 'inside', withoutEnlargement: true} : undefined)
                .jpeg({quality: 84, mozjpeg: true})
                .toBuffer();
              if (out.length < input.length * 0.97 || tooLarge) fs.writeFileSync(file, out);
            }
          }

          const manifestPath = 'data/facilities.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          for (const photo of manifest.photos ?? []) {
            const file = path.join('public', photo.src.replace(/^\//, ''));
            if (!fs.existsSync(file)) continue;
            const meta = await sharp(file).metadata();
            photo.width = meta.width;
            photo.height = meta.height;
          }
          manifest.synced_at = new Date().toISOString();
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          // Obsolete brochure crops are no longer referenced by the active photo registry.
          if (fs.existsSync('public/images/brochure')) {
            fs.rmSync('public/images/brochure', {recursive: true, force: true});
          }
          NODE
      - name: Commit optimized assets
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No image changes."
            exit 0
          fi
          git config user.name "qdis-image-qa[bot]"
          git config user.email "qdis-image-qa@users.noreply.github.com"
          git add public/images/qdis data/facilities.json
          git add -u public/images/brochure || true
          git commit -m "Optimize QDIS photo assets"
          git pull --rebase origin preview/qdis-initial-site
          git push origin HEAD:preview/qdis-initial-site
